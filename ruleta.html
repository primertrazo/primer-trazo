<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rueda cromática</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f5f3ef; color: #292929; }
main { max-width: 900px; margin: auto; }
h1 { font-size: 28px; margin-bottom: 6px; }
p { color: #666; }
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; margin-top: 24px; }
.wheel-container { width: 100%; max-width: 390px; margin: auto; }
canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: manipulation; }
.controls, .palette { background: white; padding: 20px; border-radius: 16px; margin-bottom: 16px; }
label { display: block; margin-bottom: 10px; }
input[type="color"] { width: 52px; height: 40px; border: none; background: none; cursor: pointer; vertical-align: middle; }
input[type="range"] { width: 100%; accent-color: #292929; cursor: pointer; }
.modes { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
button { padding: 10px 13px; border: 1px solid #ddd; border-radius: 9px; background: white; color: #333; cursor: pointer; font: inherit; }
button.active { background: #292929; color: white; border-color: #292929; }
.brightness-control { margin-top: 20px; }
.brightness-control label { display: flex; justify-content: space-between; }
.brightness-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.brightness-swatch { min-width: 0; padding: 0; border: 1px solid #eee; border-radius: 10px; overflow: hidden; background: white; }
.brightness-color { display: block; height: 65px; width: 100%; }
.brightness-label { display: block; padding: 8px 2px; font-size: 11px; text-align: center; overflow-wrap: anywhere; }
.brightness-group { margin-bottom: 22px; }
.hint { font-size: 13px; color: #777; }
.palette h3 { margin-top: 0; }
.palette h4 { font-size: 14px; margin-bottom: 8px; }
@media (max-width: 650px) {
  .layout { grid-template-columns: 1fr; }
  .wheel-container { max-width: 340px; }
}
</style>
</head>
<body>
<main>
<h1>Rueda cromática</h1>
<p>Elegí un color y explorá sus armonías.</p>
<div class="layout">
  <section>
    <div class="wheel-container">
      <canvas id="wheel" width="500" height="500" aria-label="Rueda cromática interactiva"></canvas>
    </div>
    <p class="hint">Hacé clic en la rueda para elegir el color base.</p>
  </section>
  <section>
    <div class="controls">
      <label for="baseColor">Color base</label>
      <input type="color" id="baseColor" value="#e94f37">
      <strong id="baseHex">#E94F37</strong>
      <div class="modes">
        <button data-mode="analogous" class="active">Análoga</button>
        <button data-mode="complementary">Complementaria</button>
        <button data-mode="triadic">Triádica</button>
        <button data-mode="tetradic">Tetrádica</button>
      </div>
      <div class="brightness-control">
        <label for="lightness">
          Luminosidad:
          <strong id="lightnessValue">57%</strong>
        </label>
        <input type="range" id="lightness" min="20" max="90" value="57">
        <p class="hint">Ajustá la luminosidad del color base. Las variantes se actualizarán automáticamente.</p>
      </div>
    </div>
    <div class="palette">
      <h3 id="paletteTitle">Paleta análoga</h3>
      <div id="swatches"></div>
      <p class="hint">Tocá una muestra para copiar su código HEX.</p>
    </div>
  </section>
</div>
</main>
<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const picker = document.getElementById("baseColor");
const baseHex = document.getElementById("baseHex");
const swatches = document.getElementById("swatches");
const paletteTitle = document.getElementById("paletteTitle");
const lightnessSlider = document.getElementById("lightness");
const lightnessValue = document.getElementById("lightnessValue");
const SIZE = 500;
const CENTER = SIZE / 2;
const RADIUS = 220;
let baseHue = 10;
let baseSaturation = 80;
let baseLightness = 57;
let mode = "analogous";
const modeNames = {
  analogous: "Paleta análoga",
  complementary: "Paleta complementaria",
  triadic: "Paleta triádica",
  tetradic: "Paleta tetrádica"
};
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100;
  l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const c = l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return Math.round(255 * c).toString(16).padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}
function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const delta = max - min;
  let h = 0;
  let s = 0;
  const l = (max + min) / 2;
  if (delta !== 0) {
    s = delta / (1 - Math.abs(2 * l - 1));
    switch (max) {
      case r: h = 60 * (((g - b) / delta) % 6); break;
      case g: h = 60 * ((b - r) / delta + 2); break;
      case b: h = 60 * ((r - g) / delta + 4); break;
    }
  }
  return { h: (h + 360) % 360, s: s * 100, l: l * 100 };
}
function getPaletteHues() {
  switch (mode) {
    case "analogous": return [baseHue - 30, baseHue, baseHue + 30];
    case "complementary": return [baseHue, baseHue + 180];
    case "triadic": return [baseHue, baseHue + 120, baseHue + 240];
    case "tetradic": return [baseHue, baseHue + 90, baseHue + 180, baseHue + 270];
  }
}
function drawWheel() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  for (let h = 0; h < 360; h++) {
    const start = (h - 90) * Math.PI / 180;
    const end = (h + 1 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.arc(CENTER, CENTER, RADIUS, start, end);
    ctx.closePath();
    ctx.fillStyle = `hsl(${h}, 85%, 55%)`;
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, 78, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
  ctx.fillStyle = "#292929";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 15px system-ui";
  ctx.fillText("COLOR", CENTER, CENTER - 10);
  ctx.fillText("BASE", CENTER, CENTER + 10);
  getPaletteHues().forEach((h, i) => {
    const angle = (h - 90) * Math.PI / 180;
    const x = CENTER + Math.cos(angle) * 170;
    const y = CENTER + Math.sin(angle) * 170;
    const color = hslToHex(h, baseSaturation, baseLightness);
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 17 : 13, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = i === 0 ? 4 : 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 20 : 16, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#292929";
    ctx.stroke();
  });
}
function renderPalette() {
  const hues = getPaletteHues();
  paletteTitle.textContent = modeNames[mode];
  baseHex.textContent = hslToHex(baseHue, baseSaturation, baseLightness).toUpperCase();
  swatches.innerHTML = "";
  hues.forEach((h, i) => {
    const group = document.createElement("div");
    group.className = "brightness-group";
    const title = document.createElement("h4");
    title.textContent = `Color ${i + 1}`;
    const variants = document.createElement("div");
    variants.className = "brightness-options";
    const brightnessLevels = [
      { name: "Oscuro", value: -20 },
      { name: "Original", value: 0 },
      { name: "Claro", value: 20 }
    ];
    brightnessLevels.forEach(variant => {
      const lightness = Math.max(0, Math.min(100, baseLightness + variant.value));
      const hex = hslToHex(h, baseSaturation, lightness).toUpperCase();
      const button = document.createElement("button");
      button.className = "brightness-swatch";
      button.title = "Copiar " + hex;
      const color = document.createElement("span");
      color.className = "brightness-color";
      color.style.backgroundColor = hex;
      const label = document.createElement("span");
      label.className = "brightness-label";
      label.textContent = `${variant.name} ${hex}`;
      button.append(color, label);
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(hex);
          label.textContent = "¡Copiado!";
          setTimeout(() => { label.textContent = `${variant.name} ${hex}`; }, 1000);
        } catch {
          window.prompt("Copiá el código HEX:", hex);
        }
      });
      variants.appendChild(button);
    });
    group.append(title, variants);
    swatches.appendChild(group);
  });
  drawWheel();
}
canvas.addEventListener("click", event => {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * SIZE / rect.width;
  const y = (event.clientY - rect.top) * SIZE / rect.height;
  const dx = x - CENTER;
  const dy = y - CENTER;
  const distance = Math.sqrt(dx * dx + dy * dy);
  if (distance < 80 || distance > RADIUS) return;
  let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  baseHue = (angle + 360) % 360;
  updatePicker();
});
function updatePicker() {
  const hex = hslToHex(baseHue, baseSaturation, baseLightness);
  picker.value = hex;
  renderPalette();
}
picker.addEventListener("input", () => {
  const hsl = hexToHsl(picker.value);
  baseHue = hsl.h;
  baseSaturation = hsl.s;
  baseLightness = hsl.l;
  lightnessSlider.value = baseLightness;
  lightnessValue.textContent = Math.round(baseLightness) + "%";
  renderPalette();
});
lightnessSlider.addEventListener("input", () => {
  baseLightness = Number(lightnessSlider.value);
  lightnessValue.textContent = baseLightness + "%";
  updatePicker();
});
document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    mode = button.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(btn => {
      btn.classList.toggle("active", btn === button);
    });
    renderPalette();
  });
});
renderPalette();
</script>
</body>
</html>
